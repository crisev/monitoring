name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # Needed to create releases and upload assets

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to fetch all history for version bumping
        
    - name: Bump version and determine tag
      id: tag_version
      shell: pwsh
      run: |
        git fetch --tags
        $allTags = git tag -l --sort=-v:refname "v*"
        $latestTag = $allTags | Where-Object { $_ -match '^v\d+\.\d+\.\d+' } | Select-Object -First 1
        if (-not $latestTag) { $latestTag = "v0.0.0" }
        
        $cleanVer = $latestTag.TrimStart('v')
        $parts = $cleanVer.Split('.')
        $major = [int]$parts[0]
        $minor = [int]$parts[1]
        $patch = [int]$parts[2] + 1
        
        $newVersion = "$major.$minor.$patch"
        $newTag = "v$newVersion"
        
        Write-Host "Determined next version: $latestTag -> $newTag ($newVersion)"
        
        "new_version=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "new_tag=$newTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Publish Monitor
      run: dotnet publish Monitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ steps.tag_version.outputs.new_version }}
      
    - name: Create Release and Upload Asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.tag_version.outputs.new_tag }}" bin/Release/net10.0-windows/win-x64/publish/Monitor.exe --title "Release ${{ steps.tag_version.outputs.new_tag }}" --generate-notes
