name: v2 server

on:
  push:
    paths:
      - 'v2/server/**'
      - '.github/workflows/v2-server.yml'
  pull_request:
    paths:
      - 'v2/server/**'

defaults:
  run:
    working-directory: v2/server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/server/package-lock.json
      - name: Check configuration
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.jsonc; then
            echo "Cloudflare not configured yet (see v2/docs/SETUP.md) - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 migrations apply monitor --remote --env parent
      - if: steps.check.outputs.skip != 'true'
        run: npm run deploy
